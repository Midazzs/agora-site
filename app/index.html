<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Agora mini MBA</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1D332D;color:#F3EFE6;font-family:system-ui,sans-serif;text-align:center;padding:24px}
p{max-width:420px;line-height:1.5}
a.btn{display:inline-block;margin-top:16px;background:#C8A35A;color:#1D332D;padding:14px 26px;border-radius:999px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>Agora mini MBA</h1>
<p id="msg">Opening Google Play…</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=app.agora.minimba">Get it on Google Play</a>
</main>
<script>
var play = "https://play.google.com/store/apps/details?id=app.agora.minimba";
var ua = navigator.userAgent || "";
if (/android/i.test(ua)) {
  location.replace(play);
} else if (/iphone|ipad|ipod/i.test(ua)) {
  document.getElementById("msg").textContent = "Agora mini MBA is on Android for now. An iPhone version is planned.";
} else {
  document.getElementById("msg").textContent = "Agora mini MBA is on Google Play for Android phones.";
}
</script>
</body>
</html>
